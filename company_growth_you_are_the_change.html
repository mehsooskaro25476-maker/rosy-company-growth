<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You Are The Change</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; background:#080b12; color:#fff;
    font-family:Arial,Helvetica,sans-serif; display:flex; align-items:center;
    justify-content:center; overflow:hidden;
  }
  .wrap{width:min(100%,1100px); padding:22px; text-align:center}
  .card{
    position:relative; overflow:hidden; border-radius:24px;
    background:linear-gradient(145deg,#111827,#05070c);
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 25px 80px rgba(0,0,0,.55); padding:22px;
  }
  h1{font-size:clamp(26px,5vw,52px); margin:4px 0 8px}
  .sub{color:#cbd5e1; font-size:clamp(15px,2.2vw,21px); margin-bottom:18px}
  .camera{
    width:min(100%,820px); aspect-ratio:16/9; margin:auto; position:relative;
    background:#020409; border-radius:18px; overflow:hidden;
  }
  video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
  .overlay{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:25px;
    background:linear-gradient(to top,rgba(0,0,0,.75),rgba(0,0,0,.15));
  }
  .message{
    max-width:850px; text-shadow:0 3px 18px #000;
    font-size:clamp(22px,4vw,43px); font-weight:700; line-height:1.18;
  }
  .highlight{font-size:clamp(28px,5vw,58px); margin-top:14px}
  button{
    margin-top:18px; border:0; border-radius:999px; padding:14px 25px;
    font-size:17px; font-weight:700; cursor:pointer;
  }
  #start{background:#fff;color:#111827}
  #status{margin-top:12px;color:#94a3b8;font-size:14px}
  .small{margin-top:12px;color:#64748b;font-size:12px}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>एक छोटी-सी बात...</h1>
    <div class="sub">कृपया नीचे दिए गए बटन पर क्लिक करके Camera की अनुमति दें।</div>

    <button id="start">मेरी स्क्रीन पर मुझे दिखाइए</button>
    <div id="status">Camera आपकी अनुमति के बाद ही चालू होगा।</div>

    <div class="camera hidden" id="cameraBox">
      <video id="video" autoplay playsinline muted></video>
      <div class="overlay">
        <div class="message" id="message">
          आप अपनी स्क्रीन पर जिसे देख रहे हैं...
          <div class="highlight">वह कोई आम इंसान नहीं है।</div>
        </div>
      </div>
    </div>

    <div class="small">
      यह demo केवल आपके browser की अनुमति से camera दिखाता है। Video कहीं upload या save नहीं किया जाता।
    </div>
  </div>
</div>

<script>
const start = document.getElementById('start');
const video = document.getElementById('video');
const box = document.getElementById('cameraBox');
const status = document.getElementById('status');
const msg = document.getElementById('message');

start.onclick = async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user" },
      audio: false
    });
    video.srcObject = stream;
    box.classList.remove('hidden');
    start.classList.add('hidden');
    status.textContent = "अब स्क्रीन को ध्यान से देखिए...";

    setTimeout(() => {
      msg.innerHTML =
        'आप अपनी स्क्रीन पर जिसे देख रहे हैं...<div class="highlight">वह कोई आम इंसान नहीं है।</div>';
    }, 1800);

    setTimeout(() => {
      msg.innerHTML =
        'वह वही इंसान है जो हमारी<br>Company की Growth में बदलाव ला सकता है।' +
        '<div class="highlight">वह इंसान... आप हैं।</div>';
    }, 4200);

    setTimeout(() => {
      msg.innerHTML =
        'हमारी Company की कई कमियों को<br>जड़ से ठीक करने की शुरुआत...<div class="highlight">आपसे हो सकती है।</div>';
    }, 7600);

  } catch (err) {
    status.textContent = "Camera permission नहीं मिली। कृपया Allow करके दोबारा कोशिश करें।";
  }
};
</script>
</body>
</html>
