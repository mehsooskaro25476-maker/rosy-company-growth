<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You Are The Change</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; background:#080b12; color:#fff;
    font-family:Arial,Helvetica,sans-serif; display:flex; align-items:center;
    justify-content:center; overflow:hidden;
  }
  .wrap{width:100%; height:100vh; padding:0; text-align:center}
  .card{
    position:relative; width:100%; height:100vh; overflow:hidden;
    background:#020409; border:0; border-radius:0; box-shadow:none; padding:0;
  }
  h1{font-size:clamp(28px,6vw,54px); margin:0 0 12px}
  .sub{color:#fff; font-size:clamp(18px,4vw,30px); margin-bottom:22px; font-weight:700}
  .camera{
    width:100%; height:100%; margin:0; position:absolute; inset:0;
    background:#020409; border-radius:0; overflow:hidden;
  }
  video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
  .message-bar{
    position:absolute; left:5%; right:5%; top:62%; transform:translateY(-50%);
    overflow:hidden; z-index:5; padding:12px 0; border-radius:14px;
    background:rgba(0,0,0,.42); border:1px solid rgba(255,255,255,.14);
  }
  .ticker{
    display:inline-block; white-space:nowrap; padding-left:100%;
    font-size:clamp(19px,4vw,34px); font-weight:700; line-height:1.25;
    text-shadow:0 2px 10px #000; animation:tickerMove 22s linear infinite;
  }
  @keyframes tickerMove{from{transform:translateX(0)}to{transform:translateX(-100%)}}
  .hidden{display:none}
  button{
    margin-top:18px; border:0; border-radius:999px; padding:14px 25px;
    font-size:17px; font-weight:700; cursor:pointer;
  }
  #start{background:#fff;color:#111827}
  #status{margin-top:12px;color:#94a3b8;font-size:14px}
  .small{margin-top:12px;color:#64748b;font-size:12px}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div id="intro">
      <h1>एक छोटी-सी बात...</h1>
      
      <button id="start">देखिए… कौन है Rosy Electronics की ताकत?</button>
    </div>

    <div class="camera hidden" id="cameraBox">
      <video id="video" autoplay playsinline muted></video>
      <div class="message-bar">
        <div class="ticker" id="message">
          अब इस चेहरे को ध्यान से देखिए… • Rosy Electronics की ताकत कौन है? • आपकी सोच, आपकी Knowledge और आपका Experience Company की Growth को नई ऊँचाइयों तक ले जा सकता है। • वह इंसान… आप हैं। • THE CHANGE STARTS WITH YOU.
        </div>
      </div>
    </div>

<script>
const start = document.getElementById('start');
const video = document.getElementById('video');
const box = document.getElementById('cameraBox');
const status = document.getElementById('status');
const msg = document.getElementById('message');
const intro = document.getElementById('intro');

start.onclick = async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user" },
      audio: false
    });
    video.srcObject = stream;
    box.classList.remove('hidden');
    intro.classList.add('hidden');
} catch (err) {
    alert("Camera permission नहीं मिली। कृपया Allow करके दोबारा कोशिश करें।");
  }
};
</script>
</body>
</html>
