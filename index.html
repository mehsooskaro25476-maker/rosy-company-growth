<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rosy Electronics</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: #000; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            color: #fff;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 1. वेलकम स्क्रीन (स्क्रीनशॉट जैसा) */
        #welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            height: 100%;
            padding: 20px;
            position: absolute;
            z-index: 10;
            background: #000;
        }
        .main-title {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 40px;
        }
        .action-btn {
            background-color: #fff;
            color: #000;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 15px 30px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,255,255,0.2);
            transition: transform 0.2s;
            margin-bottom: 50px;
        }
        .arrow-icon {
            font-size: 2rem;
            animation: bounce 2s infinite;
        }

        /* 2. मुख्य कैमरा व्यू */
        #main-view {
            display: none;
            width: 100%;
            height: 100%;
            position: relative;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* मिरर इफेक्ट */
        }
        
        /* 3. पक्का और नया रनिंग मैसेज (कैमरे के ऊपर तैरता हुआ) */
        .footer-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.9) !important; /* गाढ़ा काला बैकग्राउंड */
            padding: 25px 10px;
            border-top: 5px solid #ff9900;
            overflow: hidden;
            white-space: nowrap;
            z-index: 999999 !important; /* सबसे ऊपर रखने के लिए */
        }
        
        .running-text {
            display: inline-block;
            font-size: 1.6rem !important; /* अक्षरों को बड़ा किया */
            font-weight: bold;
            color: #ff9900 !important; /* चमकीला संतरी रंग */
            animation: marqueeEffect 18s linear infinite;
        }

        @keyframes marqueeEffect {
            0% { transform: translate3d(100%, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }
    </style>
</head>
<body>

    <!-- पहला व्यू -->
    <div id="welcome-screen">
        <div class="main-title">एक छोटी-सी बात...</div>
        <button class="action-btn" onclick="startExperience()">
            देखिए... कौन है Rosy Electronics की ताकत?
        </button>
        <div class="arrow-icon">⬇️</div>
    </div>

    <!-- दूसरा व्यू (क्लिक के बाद) -->
    <div id="main-view">
        <video id="webcam" autoplay playsinline></video>
        
        <!-- कैमरे के ऊपर तैरती हुई पट्टी -->
        <div class="footer-overlay">
            <div class="running-text">
                यह जो सामने चेहरा या व्यक्ति नज़र आ रहा है, यही वो इंसान है जो कंपनी को अपनी सूझ-बूझ और कड़ी मेहनत से आगे प्रगति पर ले जा सकता है...
            </div>
        </div>
    </div>

    <script>
        function startExperience() {
            const video = document.getElementById('webcam');
            
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false })
                    .then(stream => { 
                        video.srcObject = stream;
                        
                        // स्क्रीन बदलना
                        document.getElementById('welcome-screen').style.display = 'none';
                        document.getElementById('main-view').style.display = 'block';
                    })
                    .catch(err => { 
                        alert("कृपया कैमरा एक्सेस की अनुमति दें ताकि आप खुद को देख सकें।"); 
                    });
            } else {
                alert("आपका ब्राउज़र कैमरा सपोर्ट नहीं करता है। कृपया क्रोम या सफारी का उपयोग करें।");
            }
        }
    </script>
</body>
</html>
