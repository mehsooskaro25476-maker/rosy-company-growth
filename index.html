<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rosy Electronics</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: #000; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* पहला व्यू (Welcome Screen) */
        #welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            height: 100%;
            padding: 20px;
        }
        .main-title {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 40px;
        }
        .action-btn {
            background-color: #fff;
            color: #000;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 15px 30px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,255,255,0.2);
            transition: transform 0.2s;
            margin-bottom: 50px;
        }
        .action-btn:active {
            transform: scale(0.95);
        }
        .arrow-icon {
            font-size: 2rem;
            animation: bounce 2s infinite;
        }

        /* कैमरा और मैसेज व्यू (शुरुआत में छुपा रहेगा) */
        #main-view {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
        }
        .camera-container {
            flex: 1;
            background: #000;
            position: relative;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* मिरर इफेक्ट */
        }
        
        /* नया मोबाइल-फ्रेंडली रनिंग मैसेज */
        .footer {
            background: #111;
            padding: 20px 10px;
            border-top: 3px solid #ff9900;
            overflow: hidden;
            white-space: nowrap;
            width: 100%;
            display: flex;
            align-items: center;
        }
        .running-text {
            display: inline-block;
            font-size: 1.4rem;
            font-weight: bold;
            color: #ff9900;
            padding-left: 100%;
            animation: marqueeEffect 15s linear infinite;
        }

        @keyframes marqueeEffect {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }
    </style>
</head>
<body>

    <!-- 1. पहला व्यू: जो स्क्रीनशॉट जैसा दिखेगा -->
    <div id="welcome-screen">
        <div class="main-title">एक छोटी-सी बात...</div>
        <button class="action-btn" onclick="startExperience()">
            देखिए... कौन है Rosy Electronics की ताकत?
        </button>
        <div class="arrow-icon">⬇️</div>
    </div>

    <!-- 2. दूसरा व्यू: क्लिक करने के बाद फुल स्क्रीन कामना और मैसेज -->
    <div id="main-view">
        <div class="camera-container">
            <video id="webcam" autoplay playsinline></video>
        </div>
        <div class="footer">
            <div class="running-text">
                यह जो सामने चेहरा या व्यक्ति नज़र आ रहा है, यही वो इंसान है जो कंपनी को अपनी सूझ-बूझ और कड़ी मेहनत से आगे प्रगति पर ले जा सकता है...
            </div>
        </div>
    </div>

    <script>
        function startExperience() {
            const video = document.getElementById('webcam');
            
            // कैमरा एक्सेस मांगना
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false })
                    .then(stream => { 
                        video.srcObject = stream;
                        
                        // पहला स्क्रीन छुपाना और कैमरा स्क्रीन दिखाना
                        document.getElementById('welcome-screen').style.display = 'none';
                        document.getElementById('main-view').style.display = 'flex';
                    })
                    .catch(err => { 
                        alert("कृपया कैमरा एक्सेस की अनुमति दें ताकि आप खुद को स्क्रीन पर देख सकें।"); 
                    });
            } else {
                alert("आपका ब्राउज़र कैमरा सपोर्ट नहीं करता है। कृपया क्रोम या सफारी का उपयोग करें।");
            }
        }
    </script>
</body>
</html>
