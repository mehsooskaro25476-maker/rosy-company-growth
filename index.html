<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rosy Electronics</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: #000; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            color: #fff;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 1. वेलकम स्क्रीन */
        #welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            height: 100%;
            padding: 20px;
            position: absolute;
            z-index: 10;
            background: #000;
        }
        .main-title {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 40px;
            line-height: 1.5;
            padding: 0 10px;
        }
        .action-btn {
            background-color: #fff;
            color: #000;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 15px 30px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,255,255,0.2);
            transition: transform 0.2s;
            margin-bottom: 50px;
        }
        .arrow-icon {
            font-size: 2rem;
            animation: bounce 2s infinite;
        }

        /* 2. मुख्य कैमरा व्यू */
        #main-view {
            display: none;
            width: 100%;
            height: 100%;
            position: relative;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        
        /* 3. बिना बॉक्स वाला केवल टेक्स्ट एरिया (No Box, No Border) */
        .text-container-transparent {
            position: absolute;
            bottom: 30px; /* स्क्रीन के निचले हिस्से में फिक्स */
            left: 5%;
            width: 90%;
            height: 120px; /* सिर्फ टेक्स्ट की ऊंचाई */
            overflow: hidden; /* इसके बाहर टेक्स्ट नहीं दिखेगा */
            z-index: 999999 !important;
            background: transparent !important; /* बॉक्स पूरी तरह गायब */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* नीचे से ऊपर जाने वाला साफ़ टेक्स्ट */
        .upward-text {
            display: block;
            width: 100%;
            font-size: 1.5rem !important; /* अक्षरों को थोड़ा और साफ़ किया */
            font-weight: bold;
            color: #ff9900 !important; /* चमकीला संतरी रंग जो कैमरे पर साफ़ दिखे */
            text-align: center;
            white-space: normal;
            padding: 0 10px;
            position: relative;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 1), -2px -2px 4px rgba(0, 0, 0, 1); /* टेक्स्ट के पीछे हल्की परछाई ताकि चेहरे पर भी साफ़ पढ़े आए */
            animation: scrollUpEffect 12s linear infinite;
        }

        @keyframes scrollUpEffect {
            0% { transform: translateY(120px); }
            100% { transform: translateY(-120px); }
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }
    </style>
</head>
<body>

    <!-- पहला व्यू -->
    <div id="welcome-screen">
        <div class="main-title">एक बात जोकि आप सबको पता होनी चाहिए...</div>
        <button class="action-btn" onclick="startExperience()">
            देखिए... कौन है Rosy Electronics की ताकत?
        </button>
        <div class="arrow-icon">⬇️</div>
    </div>

    <!-- दूसरा व्यू (क्लिक के बाद) -->
    <div id="main-view">
        <video id="webcam" autoplay playsinline></video>
        
        <!-- बिना किसी डिब्बे के सीधे कैमरे पर तैरता हुआ मैसेज -->
        <div class="text-container-transparent">
            <div class="upward-text">
                यह जो सामने चेहरा या व्यक्ति नज़र आ रहा है, यही वो इंसान है जो कंपनी को अपनी सूझ-बूझ और कड़ी मेहनत से आगे प्रगति पर ले जा सकता है...
            </div>
        </div>
    </div>

    <script>
        function startExperience() {
            const video = document.getElementById('webcam');
            
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false })
                    .then(stream => { 
                        video.srcObject = stream;
                        
                        document.getElementById('welcome-screen').style.display = 'none';
                        document.getElementById('main-view').style.display = 'block';
                    })
                    .catch(err => {
                        console.log("Camera access denied.");
                    });
            }
        }
    </script>
</body>
</html>
