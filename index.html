<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rosy Electronics</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: #000; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            color: #fff;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 1. वेलकम स्क्रीन (अब आपकी नई दमदार लाइन के साथ) */
        #welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            height: 100%;
            padding: 20px;
            position: absolute;
            z-index: 10;
            background: #000;
        }
        .main-title {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 40px;
            line-height: 1.5;
            padding: 0 10px;
        }
        .action-btn {
            background-color: #fff;
            color: #000;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 15px 30px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,255,255,0.2);
            transition: transform 0.2s;
            margin-bottom: 50px;
        }
        .arrow-icon {
            font-size: 2rem;
            animation: bounce 2s infinite;
        }

        /* 2. मुख्य कैमरा व्यू */
        #main-view {
            display: none;
            width: 100%;
            height: 100%;
            position: relative;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* मिरर इफेक्ट */
        }
        
        /* 3. चेहरे के नीचे रहने वाला मैसेज बॉक्स */
        .footer-box-upward {
            position: absolute;
            bottom: 20px;
            left: 5%;
            width: 90%;
            height: 120px;
            background: rgba(0, 0, 0, 0.8) !important;
            border: 2px solid #ff9900;
            border-radius: 12px;
            overflow: hidden;
            z-index: 999999 !important;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* नीचे से ऊपर जाने वाला एनीमेशन */
        .upward-text {
            display: block;
            width: 100%;
            font-size: 1.4rem !important;
            font-weight: bold;
            color: #ff9900 !important;
            text-align: center;
            white-space: normal;
            padding: 0 15px;
            position: relative;
            animation: scrollUpEffect 12s linear infinite;
        }

        @keyframes scrollUpEffect {
            0% { transform: translateY(120px); }
            100% { transform: translateY(-120px); }
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }
    </style>
</head>
<body>

    <!-- पहला व्यू (अपडेटेड हेडिंग) -->
    <div id="welcome-screen">
        <div class="main-title">एक बात जोकि आप सबको पता होनी चाहिए...</div>
        <button class="action-btn" onclick="startExperience()">
            देखिए... कौन है Rosy Electronics की ताकत?
        </button>
        <div class="arrow-icon">⬇️</div>
    </div>

    <!-- दूसरा व्यू (क्लिक के बाद) -->
    <div id="main-view">
        <video id="webcam" autoplay playsinline></video>
        
        <div class="footer-box-upward">
            <div class="upward-text">
                यह जो सामने चेहरा या व्यक्ति नज़र आ रहा है, यही वो इंसान है जो कंपनी को अपनी सूझ-बूझ और कड़ी मेहनत से आगे प्रगति पर ले जा सकता है...
            </div>
        </div>
    </div>

    <script>
        function startExperience() {
            const video = document.getElementById('webcam');
            
            // सीधे और सबसे तेज़ तरीके से कैमरा लोड करना
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false })
                    .then(stream => { 
                        video.srcObject = stream;
                        
                        // स्क्रीन को तुरंत बदलना
                        document.getElementById('welcome-screen').style.display = 'none';
                        document.getElementById('main-view').style.display = 'block';
                    })
                    .catch(err => { 
                        alert("कृपया कैमरा अनुमति (Allow) दें ताकि आप खुद को स्क्रीन पर देख सकें।"); 
                    });
            } else {
                alert("आपका ब्राउज़र कैमरा सपोर्ट नहीं करता है। कृपया क्रोम या सफारी का उपयोग करें।");
            }
        }
    </script>
</body>
</html>
